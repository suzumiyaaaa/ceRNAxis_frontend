<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="#ffffff" stroke="#1a73e8" stroke-width="4"/>
  
  <!-- ceRNA 网络节点 -->
  <circle cx="70" cy="80" r="12" fill="#4285f4"/> <!-- miRNA 节点 -->
  <circle cx="130" cy="80" r="12" fill="#4285f4"/> <!-- mRNA 节点 -->
  <circle cx="100" cy="130" r="12" fill="#4285f4"/> <!-- lncRNA 节点 -->
  
  <!-- 互作连线 -->
