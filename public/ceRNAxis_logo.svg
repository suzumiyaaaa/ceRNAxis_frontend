  <line x1="70" y1="92" x2="100" y2="118" stroke="#1a73e8" stroke-width="3"/>
  <line x1="130" y1="92" x2="100" y2="118" stroke="#1a73e8" stroke-width="3"/>
  
  <!-- 文字标识 -->
